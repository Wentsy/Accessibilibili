name: media_kit_libs_ios_video
description: Accessibilibili iOS libmpv wrapper with VoiceOver-friendly shared audio-session support.
version: 1.1.4
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MediaKitLibsIosVideoPlugin
