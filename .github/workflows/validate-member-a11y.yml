name: Validate member VoiceOver focus fix

on:
  push:
    branches: [main]
    paths:
      - 'lib/common/a11y/a11y_focus_scroll.dart'
      - 'lib/pages/member_video/widgets/video_card_h_member_video.dart'
      - '.github/workflows/validate-member-a11y.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib/common/a11y/a11y_focus_scroll.dart lib/pages/member_video/widgets/video_card_h_member_video.dart
