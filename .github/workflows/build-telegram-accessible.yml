name: Build accessible Telegram 7.2.9

on:
  push:
    branches:
      - build/telegram-accessibility-exe
    paths:
      - '.github/workflows/build-telegram-accessible.yml'
      - 'tools/TelegramIntegrated/**'

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: cmd
    env:
      TBUILD: ${{ github.workspace }}\TBuild
      TGROOT: ${{ github.workspace }}\TBuild\tdesktop
      LIBRARIES: ${{ github.workspace }}\TBuild\Libraries\win64

    steps:
      - name: Checkout patch files
        uses: actions/checkout@v7

      - name: Prepare directories
        run: |
          mkdir "%TBUILD%"
          mkdir "%TBUILD%\Libraries"

      - name: Clone Telegram Desktop 7.2.9
        shell: bash
        run: |
          git clone --recursive --branch v7.2.9 --depth 1 https://github.com/telegramdesktop/tdesktop.git "$TBUILD/tdesktop"

      - name: Apply accessibility patch
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools/TelegramIntegrated/apply_patch.py'
          $content = Get-Content $script -Raw
          $content = $content.Replace('__TELEGRAM_ROOT__', ($env:TGROOT -replace '\\','\\'))
          $temp = Join-Path $env:RUNNER_TEMP 'apply_patch.py'
          Set-Content -Path $temp -Value $content -Encoding UTF8
          python $temp

      - name: Read SDK version
        shell: bash
        run: |
          SDK="$(grep "SDK version" "$TGROOT/docs/building-win.md" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Native Tools Command Prompt
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Third-party cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: telegram-7.2.9-win64-thirdparty-v1

      - name: Libraries cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\Libraries\win64
          key: telegram-7.2.9-win64-libraries-qt6-v1

      - name: Prepare Telegram libraries
        run: |
          "%TGROOT%\Telegram\build\prepare\win.bat" skip-release silent qt6

      - name: Configure accessible Telegram
        run: |
          cd /d "%TGROOT%\Telegram"
          call configure.bat x64 qt6 ^
            -D TDESKTOP_API_ID=611335 ^
            -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c ^
            -D CMAKE_CONFIGURATION_TYPES=Debug ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Build Telegram
        run: |
          cmake --build "%TBUILD%\tdesktop\out" --config Debug --parallel

      - name: Prepare portable artifact
        shell: pwsh
        run: |
          $out = Join-Path $env:TGROOT 'out\Release'
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          Copy-Item (Join-Path $out 'Telegram.exe') $artifact
          @'
          Telegram Desktop 7.2.9 - 希希無障礙測試版

          這是直接整合進 Telegram.exe 的版本，不依賴 NVDA 外掛。

          第一版重點：
          1. NVDA/螢幕閱讀器模式下，Bot Commands（例如 /help）不再吃掉第一次 Tab。
          2. 訊息輸入框按一次 Tab，直接進訊息清單。
          3. 語音訊息維持 Telegram 原生 Space 播放/暫停。
          4. 已停用自動更新，避免官方更新覆蓋無障礙修改。

          建議先不要覆蓋舊版本，放在另一個資料夾測試。
          '@ | Set-Content -Path (Join-Path $artifact 'README.txt') -Encoding UTF8

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: Telegram-7.2.9-XiXi-Accessible-x64
          path: artifact\
          retention-days: 3
