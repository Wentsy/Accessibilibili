name: Validate photo export changes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-photo-export.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Analyze changed Dart files
        run: flutter analyze lib/services/download/photo_export.dart lib/pages/video/view.dart
